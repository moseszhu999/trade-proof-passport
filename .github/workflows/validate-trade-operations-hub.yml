      - 'docs/supplier-decisions.css'
      - 'docs/supplier-decisions.mjs'
      - 'docs/supplier-decision-core.mjs'
      - 'docs/data/opportunity-radar-latest.json'
      - 'docs/data/supplier-candidates-hospital-furniture-v0.4.json'
