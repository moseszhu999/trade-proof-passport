      - 'docs/guides/supplier-candidate-workspace-v0.4.md'
      - 'docs/guides/supplier-response-workspace-v0.5.md'
      - 'docs/guides/supplier-outreach-preparation-v0.6.md'
      - 'docs/guides/inbound-communication-threading-v0.7.md'
      - 'docs/guides/supplier-evidence-verification-queue-v0.8.md'
      - 'docs/guides/evidence-external-verification-handoff-v0.9.md'
