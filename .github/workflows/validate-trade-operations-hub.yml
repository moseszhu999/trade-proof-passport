      - 'schema/supplier-outreach.schema.json'
      - 'schema/inbound-communication.schema.json'
      - 'schema/supplier-evidence.schema.json'
      - 'schema/evidence-verification.schema.json'
      - 'schema/supplier-decision.schema.json'
      - 'tools/verify-trade-operations-hub.mjs'
      - 'tools/verify-local-document-intake.mjs'
      - 'tools/verify-supplier-candidate-workspace.mjs'
      - 'tools/verify-supplier-response-workspace.mjs'
      - 'tools/verify-supplier-outreach-workspace.mjs'
      - 'tools/verify-inbound-communication-threading.mjs'
      - 'tools/verify-supplier-evidence-workspace.mjs'
      - 'tools/verify-evidence-verification-handoff.mjs'
      - 'tools/verify-supplier-decision-workspace.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse canonical JSON inputs
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('docs/data/opportunity-radar-latest.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('docs/data/supplier-candidates-hospital-furniture-v0.4.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/trade-case.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/supplier-response.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/supplier-outreach.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/inbound-communication.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/supplier-evidence.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/evidence-verification.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/supplier-decision.schema.json','utf8'))"
      - name: Syntax-check browser modules
        run: |
          node --check docs/trade-case-core.mjs
          node --check docs/operations.mjs
          node --check docs/local-document-intake.mjs
          node --check docs/document-intake-ui.mjs
          node --check docs/supplier-candidate-core.mjs
          node --check docs/suppliers.mjs
          node --check docs/supplier-response-core.mjs
          node --check docs/supplier-responses.mjs
          node --check docs/supplier-contact-core.mjs
          node --check docs/supplier-outreach-core.mjs
          node --check docs/supplier-outreach.mjs
          node --check docs/inbound-communication-core.mjs
          node --check docs/inbound-communications.mjs
          node --check docs/supplier-evidence-core.mjs
          node --check docs/supplier-evidence.mjs
          node --check docs/evidence-verification-core.mjs
          node --check docs/evidence-verification.mjs
          node --check docs/supplier-decision-core.mjs
          node --check docs/supplier-decisions.mjs
      - name: Validate Trade Daily Operations Hub
        run: node tools/verify-trade-operations-hub.mjs
      - name: Validate controlled local document intake
        run: node tools/verify-local-document-intake.mjs
      - name: Validate supplier candidate workspace
        run: node tools/verify-supplier-candidate-workspace.mjs
      - name: Validate supplier response workspace
        run: node tools/verify-supplier-response-workspace.mjs
      - name: Validate supplier outreach preparation
        run: node tools/verify-supplier-outreach-workspace.mjs
      - name: Validate inbound communication threading
        run: node tools/verify-inbound-communication-threading.mjs
      - name: Validate supplier evidence verification queue
        run: node tools/verify-supplier-evidence-workspace.mjs
      - name: Validate evidence external verification handoff
        run: node tools/verify-evidence-verification-handoff.mjs
      - name: Validate supplier decision workspace
        run: node tools/verify-supplier-decision-workspace.mjs
