      - 'docs/document-intake.html'
      - 'docs/document-intake.css'
      - 'docs/document-intake-ui.mjs'
      - 'docs/local-document-intake.mjs'
      - 'docs/suppliers.html'
      - 'docs/suppliers.css'
      - 'docs/suppliers.mjs'
      - 'docs/supplier-candidate-core.mjs'
      - 'docs/supplier-responses.html'
      - 'docs/supplier-responses.css'
      - 'docs/supplier-responses.mjs'
