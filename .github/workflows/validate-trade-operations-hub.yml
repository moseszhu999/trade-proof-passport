name: Validate Trade Daily Operations Hub

on:
  pull_request:
    paths:
      - 'docs/operations.html'
      - 'docs/operations.css'
      - 'docs/operations.mjs'
      - 'docs/trade-case-core.mjs'
      - 'docs/document-intake.html'
      - 'docs/document-intake.css'
      - 'docs/document-intake-ui.mjs'
      - 'docs/local-document-intake.mjs'
      - 'docs/data/opportunity-radar-latest.json'
      - 'docs/guides/trade-daily-operations-hub-v0.1.md'
      - 'docs/guides/trade-case-intake-v0.2.md'
      - 'docs/guides/local-document-intake-v0.3.md'
      - 'schema/trade-case.schema.json'
      - 'tools/verify-trade-operations-hub.mjs'
      - 'tools/verify-local-document-intake.mjs'
      - '.github/workflows/validate-trade-operations-hub.yml'
  push:
    branches: [main]
    paths:
      - 'docs/operations.html'
      - 'docs/operations.css'
      - 'docs/operations.mjs'
      - 'docs/trade-case-core.mjs'
      - 'docs/document-intake.html'
      - 'docs/document-intake.css'
      - 'docs/document-intake-ui.mjs'
      - 'docs/local-document-intake.mjs'
      - 'docs/data/opportunity-radar-latest.json'
      - 'docs/guides/local-document-intake-v0.3.md'
      - 'schema/trade-case.schema.json'
      - 'tools/verify-trade-operations-hub.mjs'
      - 'tools/verify-local-document-intake.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse canonical JSON inputs
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('docs/data/opportunity-radar-latest.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schema/trade-case.schema.json','utf8'))"
      - name: Syntax-check browser modules
        run: |
          node --check docs/trade-case-core.mjs
          node --check docs/operations.mjs
          node --check docs/local-document-intake.mjs
          node --check docs/document-intake-ui.mjs
      - name: Validate Trade Daily Operations Hub
        run: node tools/verify-trade-operations-hub.mjs
      - name: Validate controlled local document intake
        run: node tools/verify-local-document-intake.mjs
