name: Validate Trade Proof Passport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry for Solidity ABI cross-checks
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Parse canonical JSON files
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          for (const file of [
            'schema/trade-proof-passport.schema.json',
            'schema/trade-proof-response.schema.json',
            'schema/real-world-proof-request.schema.json',
            'schema/real-world-proof-request-response.schema.json',
            'tokenomics/tproof-tokenomics-v0.1.json',
            'docs/contracts/base-sepolia-v0.1.json',
            'examples/steel-cabinet-passport.json',
            'examples/genesis-proof-allocation-input.json',
            'examples/genesis-proof-allocation-output.json'
          ]) {
            JSON.parse(readFileSync(file, 'utf8'));
          }
          console.log('PASS: Passport, response, RWP request/response, tokenomics, contracts and allocation JSON parse');
          NODE

      - name: Validate steel cabinet Trade RWP example
        run: node tools/verify-passport.mjs examples/steel-cabinet-passport.json

      - name: Validate RWP provenance, deterministic digest and viral card integrity
        run: node tools/verify-rwp-core.mjs

      - name: Validate RWP recipient requests and follow-up lineage
        run: |
          node tools/verify-rwp-request.mjs
          node tools/verify-passport.mjs /tmp/rwp-follow-up-passport.json

      - name: Validate holder-side RWP Request Responses
        run: node tools/verify-rwp-request-response.mjs

      - name: Validate holder-side RWP response public surface
        run: node tools/validate-rwp-response-page.mjs

      - name: Validate RWP public narrative, privacy and useful viral surface
        run: node tools/validate-rwp-page.mjs

      - name: Validate browser product, sharing, responses, Registry facts and token boundaries
        run: node tools/validate-public-product.mjs

      - name: Validate launch-site visuals, token allocation and multilingual coverage
        run: node tools/validate-landing-i18n.mjs

      - name: Validate TPROOF machine-readable economics
        run: node tools/verify-tokenomics.mjs

      - name: Validate TPROOF public economics surface
        run: node tools/validate-tokenomics-page.mjs

      - name: Validate deterministic Genesis allocation compiler
        run: node tools/verify-season-allocation.mjs

      - name: Cross-check claim leaves and Merkle root with Foundry cast
        run: node tools/verify-season-allocation-cast.mjs

      - name: Validate Genesis simulator and discovery surfaces
        run: node tools/validate-genesis-simulator.mjs

      - name: Validate Registry digest, ABI and read model
        run: node tools/verify-registry-client.mjs

      - name: Validate bounded onchain Registry public surface
        run: node tools/validate-onchain-page.mjs

      - name: Recompile and compare canonical allocation vector
        run: |
          node tools/compile-season-allocation.mjs \
            examples/genesis-proof-allocation-input.json \
            /tmp/genesis-proof-allocation-output.json
          cmp examples/genesis-proof-allocation-output.json /tmp/genesis-proof-allocation-output.json
          echo "PASS: canonical allocation vector is deterministic"
