name: Validate Trade Proof Passport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry for Solidity ABI cross-checks
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Parse canonical JSON files
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          for (const file of [
            'schema/trade-proof-passport.schema.json',
            'schema/trade-proof-response.schema.json',
            'schema/real-world-proof-request.schema.json',
            'schema/real-world-proof-request-response.schema.json',
            'schema/real-world-proof-evidence-package.schema.json',
            'schema/real-world-proof-evidence-receipt.schema.json',
            'schema/real-world-proof-evidence-resolution.schema.json',
            'schema/real-world-proof-case-graph.schema.json',
            'schema/real-world-proof-trade-pool.schema.json',
            'schema/real-world-proof-pool-adoption.schema.json',
            'schema/real-world-proof-liquidity.schema.json',
            'schema/real-world-proof-pool-directory.schema.json',
            'tokenomics/tproof-tokenomics-v0.1.json',
            'docs/contracts/base-sepolia-v0.1.json',
            'examples/steel-cabinet-passport.json',
            'examples/genesis-proof-allocation-input.json',
            'examples/genesis-proof-allocation-output.json'
          ]) {
            JSON.parse(readFileSync(file, 'utf8'));
          }
          console.log('PASS: Passport, RWP request/response/evidence package/receipt/resolution/case graph/trade pool/adoption/liquidity/directory, tokenomics, contracts and allocation JSON parse');
          NODE

      - name: Validate steel cabinet Trade RWP example
        run: node tools/verify-passport.mjs examples/steel-cabinet-passport.json

      - name: Validate RWP provenance, deterministic digest and viral card integrity
        run: node tools/verify-rwp-core.mjs

      - name: Validate RWP recipient requests and follow-up lineage
        run: |
          node tools/verify-rwp-request.mjs
          node tools/verify-passport.mjs /tmp/rwp-follow-up-passport.json

      - name: Validate holder-side RWP Request Responses
        run: node tools/verify-rwp-request-response.mjs

      - name: Validate holder-side RWP response public surface
        run: node tools/validate-rwp-response-page.mjs

      - name: Validate authorized RWP Evidence Packages
        run: node tools/verify-rwp-evidence-package.mjs

      - name: Validate local-only RWP Evidence Package surface
        run: node tools/validate-rwp-evidence-page.mjs

      - name: Validate recipient-side RWP Evidence Receipts
        run: node tools/verify-rwp-evidence-receipt.mjs

      - name: Validate local RWP Evidence Receipt surface
        run: node tools/validate-rwp-receive-page.mjs

      - name: Validate append-only RWP Evidence Resolutions
        run: node tools/verify-rwp-evidence-resolution.mjs

      - name: Validate local RWP Evidence Resolution surface
        run: node tools/validate-rwp-resolution-page.mjs

      - name: Validate deterministic branched RWP Case Graphs
        run: node tools/verify-rwp-case-graph.mjs

      - name: Validate local Case Graph and public Timeline surface
        run: node tools/validate-rwp-graph-page.mjs

      - name: Validate deterministic RWP Proof Patterns and Trade Pools
        run: node tools/verify-rwp-proof-pool.mjs

      - name: Validate local Trade Pool and public fork surface
        run: node tools/validate-rwp-pool-page.mjs

      - name: Validate independent Pool Adoption Receipts and Proof Liquidity
        run: node tools/verify-rwp-pool-adoption.mjs

      - name: Validate local Pool adoption and public card surface
        run: node tools/validate-rwp-adopt-page.mjs

      - name: Validate deterministic duplicate-resistant Proof Liquidity Snapshots
        run: node tools/verify-rwp-proof-liquidity.mjs

      - name: Validate local Proof Liquidity and public aggregate surface
        run: node tools/validate-rwp-liquidity-page.mjs

      - name: Validate deterministic open RWP Pool Directories
        run: node tools/verify-rwp-pool-directory.mjs

      - name: Validate local open Directory and public discovery surface
        run: node tools/validate-rwp-directory-page.mjs

      - name: Validate reproducible RWP Pool Adoption Case Study
        run: node tools/verify-rwp-pool-adoption-case-study.mjs

      - name: Validate public RWP Pool adoption case study surface
        run: node tools/validate-rwp-case-study-page.mjs

      - name: Validate two-unit RWP External Adoption Pilot
        run: node tools/verify-rwp-external-adoption-pilot.mjs

      - name: Validate local RWP External Adoption Pilot surface
        run: node tools/validate-rwp-pilot-page.mjs

      - name: Validate RWP public narrative, privacy and useful viral surface
        run: node tools/validate-rwp-page.mjs

      - name: Validate browser product, sharing, responses, Registry facts and token boundaries
        run: node tools/validate-public-product.mjs

      - name: Validate launch-site visuals, token allocation and multilingual coverage
        run: node tools/validate-landing-i18n.mjs

      - name: Validate TPROOF machine-readable economics
        run: node tools/verify-tokenomics.mjs

      - name: Validate TPROOF public economics surface
        run: node tools/validate-tokenomics-page.mjs

      - name: Validate deterministic Genesis allocation compiler
        run: node tools/verify-season-allocation.mjs

      - name: Cross-check claim leaves and Merkle root with Foundry cast
        run: node tools/verify-season-allocation-cast.mjs

      - name: Validate Genesis simulator and discovery surfaces
        run: node tools/validate-genesis-simulator.mjs

      - name: Validate Registry digest, ABI and read model
        run: node tools/verify-registry-client.mjs

      - name: Validate bounded onchain Registry public surface
        run: node tools/validate-onchain-page.mjs

      - name: Recompile and compare canonical allocation vector
        run: |
          node tools/compile-season-allocation.mjs \
            examples/genesis-proof-allocation-input.json \
            /tmp/genesis-proof-allocation-output.json
          cmp examples/genesis-proof-allocation-output.json /tmp/genesis-proof-allocation-output.json
          echo "PASS: canonical allocation vector is deterministic"
