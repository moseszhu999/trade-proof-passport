name: Validate Trade Proof Passport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse JSON Schemas
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          for (const file of [
            'schema/trade-proof-passport.schema.json',
            'schema/trade-proof-response.schema.json',
            'tokenomics/tproof-tokenomics-v0.1.json'
          ]) {
            JSON.parse(readFileSync(file, 'utf8'));
          }
          console.log('PASS: Passport, response and tokenomics JSON parse');
          NODE

      - name: Validate steel cabinet example
        run: node tools/verify-passport.mjs examples/steel-cabinet-passport.json

      - name: Validate browser product, sharing, responses, Registry facts and token boundaries
        run: node tools/validate-public-product.mjs

      - name: Validate TPROOF machine-readable economics
        run: node tools/verify-tokenomics.mjs

      - name: Validate TPROOF public economics surface
        run: node tools/validate-tokenomics-page.mjs
