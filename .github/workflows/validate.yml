name: Validate Trade Proof Passport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse JSON Schemas
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          for (const file of [
            'schema/trade-proof-passport.schema.json',
            'schema/trade-proof-response.schema.json'
          ]) {
            JSON.parse(readFileSync(file, 'utf8'));
          }
          console.log('PASS: Passport and response schema JSON parse');
          NODE

      - name: Validate steel cabinet example
        run: |
          node tools/verify-passport.mjs examples/steel-cabinet-passport.json

      - name: Validate privacy-bounded public summary helpers
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import {
            buildPublicSummary,
            buildPublicSummaryUrl,
            decodePublicSummary,
            encodePublicSummary,
            validatePassport
          } from './docs/passport-share.mjs';

          const passport = JSON.parse(readFileSync('examples/steel-cabinet-passport.json', 'utf8'));
          const errors = validatePassport(passport);
          if (errors.length > 0) throw new Error(errors.join(' '));

          const summary = buildPublicSummary(passport);
          const serialized = JSON.stringify(summary);
          for (const forbidden of [
            'Example Exporter Ltd.',
            'party:exporter:example',
            'evidence://',
            '1111111111111111111111111111111111111111111111111111111111111111',
            '"digest"'
          ]) {
            if (serialized.includes(forbidden)) throw new Error(`Public summary leaked forbidden value: ${forbidden}`);
          }

          if (summary.counts.evidence !== 4 || summary.counts.confirmations !== 3 || summary.facts.length !== 3) {
            throw new Error('Public summary counts do not match the source Passport.');
          }

          const payload = encodePublicSummary(summary);
          const decoded = decodePublicSummary(payload);
          if (decoded.passportId !== passport.passportId || decoded.tradeCase.caseReference !== 'SC-EXPORT-001') {
            throw new Error('Public summary did not survive encode/decode round trip.');
          }

          const shareUrl = buildPublicSummaryUrl(passport, 'https://example.com/view.html?source=draft#old');
          if (!shareUrl.startsWith('https://example.com/respond.html#p=')) {
            throw new Error('New share URLs must open the response-enabled page.');
          }

          console.log('PASS: public summary round trip preserves allowed fields and routes to response page');
          NODE

      - name: Validate standard response helpers
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { buildPublicSummary, encodePublicSummary } from './docs/passport-share.mjs';
          import {
            buildResponse,
            buildResponseUrl,
            decodeResponse,
            encodeResponse,
            validateResponse
          } from './docs/passport-response.mjs';

          const passport = JSON.parse(readFileSync('examples/steel-cabinet-passport.json', 'utf8'));
          const summary = buildPublicSummary(passport);
          const response = buildResponse(summary, {
            decision: 'request_change',
            responderRole: 'buyer',
            comment: 'Please clarify the pickup date.'
          });

          const errors = validateResponse(response, summary);
          if (errors.length > 0) throw new Error(errors.join(' '));
          if (response.decision.status !== 'request_change' || response.responder.role !== 'buyer') {
            throw new Error('Response decision or role was not preserved.');
          }

          const serialized = JSON.stringify(response);
          for (const forbidden of [
            'Example Exporter Ltd.',
            'party:exporter:example',
            'evidence://',
            '"digest"',
            '"displayName"',
            '"partyId"'
          ]) {
            if (serialized.includes(forbidden)) throw new Error(`Response leaked forbidden value: ${forbidden}`);
          }

          const payload = encodeResponse(response);
          const decoded = decodeResponse(payload);
          if (decoded.responseId !== response.responseId || decoded.passportReference.passportId !== passport.passportId) {
            throw new Error('Response did not survive encode/decode round trip.');
          }

          const p = encodePublicSummary(summary);
          const responseUrl = buildResponseUrl(response, `https://example.com/respond.html#p=${p}`);
          const params = new URLSearchParams(new URL(responseUrl).hash.slice(1));
          if (!params.get('p') || !params.get('r')) throw new Error('Response URL must carry both Passport and response payloads.');

          for (const decision of ['confirm', 'reject', 'request_change']) {
            const candidate = buildResponse(summary, { decision, responderRole: 'inspection', comment: '' });
            if (candidate.decision.status !== decision) throw new Error(`Decision was not supported: ${decision}`);
          }

          console.log('PASS: response round trip preserves bounded decisions and excludes private references');
          NODE

      - name: Validate token-native public site and product surfaces
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const landing = readFileSync('docs/index.html', 'utf8');
          const example = readFileSync('docs/example.html', 'utf8');
          const builder = readFileSync('docs/create.html', 'utf8');
          const viewer = readFileSync('docs/view.html', 'utf8');
          const responder = readFileSync('docs/respond.html', 'utf8');
          const shareModule = readFileSync('docs/passport-share.mjs', 'utf8');
          const responseModule = readFileSync('docs/passport-response.mjs', 'utf8');
          const responseStandard = readFileSync('standard/trade-proof-response-v0.1.md', 'utf8');
          const sitemap = readFileSync('docs/sitemap.xml', 'utf8');
          const robots = readFileSync('docs/robots.txt', 'utf8');
          const readme = readFileSync('README.md', 'utf8');
          const contract = '0xad1c714140ceb8ed7c5234d939a06926f5edaba2';

          for (const value of [
            'Proof for trade.',
            'Ownership for contributors.',
            'Live on Base Sepolia',
            '$TPROOF · Not live',
            'Not a landing page pretending to be a product.',
            'Create a Passport',
            './create.html',
            './view.html',
            './respond.html',
            './example.html',
            contract,
            'No sale is active.',
            'Utility first. Contribution next. Token last.',
            'Share the project'
          ]) {
            if (!landing.includes(value)) throw new Error(`Missing token-native landing content: ${value}`);
          }

          for (const forbidden of [
            'Guaranteed return',
            'guaranteed return',
            'Guaranteed profit',
            'guaranteed profit',
            'Buy $TPROOF now',
            'Public sale is live',
            'APY',
            'revenue share'
          ]) {
            if (landing.includes(forbidden)) throw new Error(`Unsafe or false token claim found: ${forbidden}`);
          }

          for (const value of [
            'Steel Cabinet Trade Proof Passport',
            'tpp:example:steel-cabinet:001',
            'Synthetic demonstration',
            'What this page does not prove',
            './create.html',
            './view.html'
          ]) {
            if (!example.includes(value)) throw new Error(`Missing example page content: ${value}`);
          }

          for (const value of [
            'Create a draft Passport',
            'Local-only:',
            "schemaVersion:'0.1'",
            "lifecycle:{status:'draft'}",
            'Generate and download JSON',
            'tradeProofPassportDraft',
            './view.html?source=draft',
            './example.html'
          ]) {
            if (!builder.includes(value)) throw new Error(`Missing builder content: ${value}`);
          }

          for (const value of [
            'Import a Passport JSON',
            'Create public summary link',
            'No file is uploaded.',
            'URL fragment',
            './passport-share.mjs',
            'evidence URIs',
            'party identifiers'
          ]) {
            if (!viewer.includes(value)) throw new Error(`Missing viewer content: ${value}`);
          }

          for (const value of [
            'Review and respond',
            'Confirm',
            'Reject',
            'Request change',
            'Generate response JSON and link',
            './passport-response.mjs',
            'unsigned and self-declared',
            'What this response does not prove'
          ]) {
            if (!responder.includes(value)) throw new Error(`Missing response page content: ${value}`);
          }

          for (const value of [
            'buildPublicSummary',
            'encodePublicSummary',
            'decodePublicSummary',
            "format: 'trade-proof-passport-public-summary'",
            "disclosure: { profile: 'public_summary' }",
            "'respond.html'"
          ]) {
            if (!shareModule.includes(value)) throw new Error(`Missing share-module contract: ${value}`);
          }

          for (const value of [
            'buildResponse',
            'encodeResponse',
            'decodeResponse',
            'buildResponseUrl',
            "type: 'unsigned_self_declared'",
            "profile: 'public_response'"
          ]) {
            if (!responseModule.includes(value)) throw new Error(`Missing response-module contract: ${value}`);
          }

          for (const value of [
            '# Trade Proof Response v0.1',
            '`confirm`',
            '`reject`',
            '`request_change`',
            'unsigned and self-declared'
          ]) {
            if (!responseStandard.includes(value)) throw new Error(`Missing response standard content: ${value}`);
          }

          for (const value of [
            'Proof for trade. Ownership for contributors.',
            contract,
            '`$TPROOF` is **not live**',
            'Token state must never determine whether a Passport or Response is valid'
          ]) {
            if (!readme.includes(value)) throw new Error(`Missing README product/token boundary: ${value}`);
          }

          for (const url of [
            'https://moseszhu999.github.io/trade-proof-passport/',
            'https://moseszhu999.github.io/trade-proof-passport/example.html',
            'https://moseszhu999.github.io/trade-proof-passport/create.html',
            'https://moseszhu999.github.io/trade-proof-passport/view.html',
            'https://moseszhu999.github.io/trade-proof-passport/respond.html'
          ]) {
            if (!sitemap.includes(url)) throw new Error(`Missing sitemap URL: ${url}`);
          }

          if (!robots.includes('Sitemap: https://moseszhu999.github.io/trade-proof-passport/sitemap.xml')) {
            throw new Error('robots.txt does not reference the sitemap');
          }

          console.log('PASS: token-native landing, live utility loop, Registry facts and token safety boundaries are present');
          NODE
