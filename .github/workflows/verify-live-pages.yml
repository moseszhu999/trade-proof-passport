name: Verify Live GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/verify-live-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/verify-live-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages publication and verify health
        shell: bash
        run: |
          set -euo pipefail
          base='https://moseszhu999.github.io/trade-proof-passport'
          ok=false
          for attempt in $(seq 1 24); do
            echo "Health probe attempt ${attempt}/24"
            if body=$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${base}/health.json?commit=${GITHUB_SHA}"); then
              if node -e '
                const payload = JSON.parse(process.argv[1]);
                if (payload.site !== "trade-proof-passport" || payload.status !== "ok") process.exit(1);
                if (!payload.entrypoints?.includes("index.html") || !payload.entrypoints?.includes("operations.html")) process.exit(1);
              ' "$body"; then
                ok=true
                break
              fi
            fi
            sleep 15
          done
          if [[ "$ok" != true ]]; then
            echo 'Live health probe did not become ready.' >&2
            exit 1
          fi

      - name: Verify public operations entry and assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://moseszhu999.github.io/trade-proof-passport'
          operations=$(curl --fail --silent --show-error --location --max-time 30 \
            -H 'Cache-Control: no-cache' "${base}/operations.html?commit=${GITHUB_SHA}")
          grep -F './pages-runtime-guard.mjs' <<<"$operations"
          grep -F './operations.mjs' <<<"$operations"
          grep -F './enterprise-operations-shell-v1.mjs' <<<"$operations"
          curl --fail --silent --show-error --location --max-time 30 \
            "${base}/pages-runtime-guard.mjs?commit=${GITHUB_SHA}" | grep -F '页面资源加载超时'
          curl --fail --silent --show-error --location --max-time 30 \
            "${base}/data/opportunity-radar-latest.json?commit=${GITHUB_SHA}" | node -e '
              let source = "";
              process.stdin.on("data", chunk => source += chunk);
              process.stdin.on("end", () => {
                const payload = JSON.parse(source);
                if (!Array.isArray(payload.opportunities) || payload.opportunities.length === 0) process.exit(1);
                console.log(`PASS: ${payload.opportunities.length} public opportunities available`);
              });
            '

      - name: Record live URLs
        run: |
          echo 'PASS: https://moseszhu999.github.io/trade-proof-passport/'
          echo 'PASS: https://moseszhu999.github.io/trade-proof-passport/operations.html'
          echo 'PASS: https://moseszhu999.github.io/trade-proof-passport/health.json'
